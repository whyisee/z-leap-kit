# whyisee.xyz 线上 nginx 配置底本（与 /etc/nginx/conf.d/whyisee.conf 对齐，2026-11-17 核对）
#
# 相对线上版本的唯一差异：新增 location /api/v1/ 段（app 协议层）。
# 证书三块由 certbot 管理，不要手改；renew 后 certbot 会自己重写。
#
# 应用端口是 4321（不是 3000）。对应的 systemd unit 必须设 PORT=4321，
# 否则 Astro standalone 会落到默认 8080，这里就 502。
#
# 生效：nginx -t && systemctl reload nginx

server {
    if ($host = www.whyisee.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = whyisee.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name whyisee.xyz www.whyisee.xyz;
    return 301 https://whyisee.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.whyisee.xyz;

    ssl_certificate /etc/letsencrypt/live/whyisee.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whyisee.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://whyisee.xyz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whyisee.xyz;

    ssl_certificate /etc/letsencrypt/live/whyisee.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/whyisee.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # app 协议层：不缓存、超时收紧。
    # X-Forwarded-Proto 必须保留 —— Astro 的 security.checkOrigin 会拿 Origin
    # 和请求协议比对，缺了它客户端 multipart 上传会被判 403。
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
